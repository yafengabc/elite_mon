name: Android

# Builds the Android app without any Android toolchain on your machine:
# this workflow installs Node, Java and the Android SDK itself.
#
# Two ways in:
#   - workflow_dispatch: build on demand, artifacts only.
#   - a v* tag: build and attach to the GitHub Release (release.yml creates it).
#
# Signing is required. The release APK is unsigned until it is signed, and an
# unsigned APK cannot be installed, so the workflow fails when the keystore
# secrets are missing rather than falling back to a debug build. A debug APK is
# signed with the *public* Android debug key -- it proves nothing about where it
# came from, and its name ("app-debug.apk") reads like a mistake in a release.
# Pull requests are the exception: secrets are never exposed to them, so they
# build for the compile check and publish nothing.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Capacitor 8 compiles at Java 21 and needs AGP 8.13 / Gradle 8.14.
      # No `cache: gradle`: the native project does not exist at checkout time
      # (cap add android creates it later), and setup-java fails outright when it
      # finds nothing to cache.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The ubuntu image already ships an Android SDK, so no setup action is
      # needed. (android-actions/setup-android fails on current images: it asks
      # sdkmanager for the "tools" package, which cmdline-tools 16 removed.)
      # Gradle downloads whatever platform/build-tools this project needs.
      - name: Locate the Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls "$SDK"

      - name: Install web dependencies
        working-directory: mobile
        run: npm ci

      # The native project is generated here, not committed: it is a template
      # copy plus your web assets, so it can always be recreated from scratch.
      - name: Create the Android project
        working-directory: mobile
        run: npx cap add android

      - name: Sync web assets into the project
        working-directory: mobile
        run: npx cap sync android

      # Android 9+ refuses plain HTTP unless the app opts in. The app talks to a
      # PC on the LAN over http://192.168.x.x:8088, so without this every API
      # call fails with a cleartext error and the dashboard just sits empty.
      # (Capacitor's template does not set it, and `cap sync` can regenerate the
      # manifest on top of our edit, so this patch runs AFTER sync and is
      # idempotent -- it always takes effect on the manifest we actually build.)
      - name: Allow cleartext traffic to the LAN
        working-directory: mobile
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if grep -q usesCleartextTraffic "$M"; then
            echo "already present"
          else
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$M"
          fi
          grep -n usesCleartextTraffic "$M"

      - name: Build release APK and AAB
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Sign the release artifacts
        working-directory: mobile/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_ALIAS" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::keystore secrets are not exposed to pull requests -- signing skipped."
              echo "SKIP_RELEASE=1" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::No keystore secrets. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (see mobile/README.md); refusing to publish an unsigned APK."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > /tmp/upload.keystore
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/*/ | tail -1)"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk

          # APK: align first, then sign with apksigner (v2/v3 scheme).
          "$BT/zipalign" -f 4 "$UNSIGNED" app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" sign \
            --ks /tmp/upload.keystore --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release.apk
          # --print-certs puts the signer's fingerprint in the log, so the run
          # itself proves which key signed the artifact.
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release-signed.apk

          # AAB: jarsigner is the signing tool for bundles (no zipalign step).
          jarsigner -keystore /tmp/upload.keystore -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            app/build/outputs/bundle/release/app-release.aab "$KS_ALIAS"
          rm -f /tmp/upload.keystore

      - name: Collect artifacts
        if: env.SKIP_RELEASE != '1'
        working-directory: mobile/android
        run: |
          mkdir -p ../../out
          # Version the names: the build's own ("app-release-signed.apk") say
          # nothing about which build it is, and a download should be
          # self-describing. On a tag that is the tag; on a manual run, the
          # branch is not useful, so a short sha identifies it.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME}"; else V="dev-$(echo "${GITHUB_SHA}" | cut -c1-7)"; fi
          cp app/build/outputs/apk/release/app-release-signed.apk "../../out/elite-mon-${V}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../../out/elite-mon-${V}.aab"
          ls -la ../../out

      - uses: actions/upload-artifact@v4
        if: env.SKIP_RELEASE != '1'
        with:
          name: elite-mon-apk
          path: out/

      - name: Attach to the Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # release.yml creates the Release from the same tag; it usually lands
          # first, but wait rather than assume - uploading to a Release that
          # does not exist yet fails.
          for i in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "waiting for the $TAG release to appear ($i)..."
            sleep 10
          done
          FILES=""
          # Glob rather than hardcoding names, so renaming the artifacts in the
          # Collect step cannot silently leave this one uploading nothing.
          for f in out/*.apk out/*.aab; do
            if [ -f "$f" ]; then FILES="$FILES $f"; fi
          done
          if [ -z "$FILES" ]; then echo "nothing to attach"; exit 0; fi
          gh release upload "$TAG" $FILES --clobber
