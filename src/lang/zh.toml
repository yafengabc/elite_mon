# Elite Dangerous Journal Monitor - language file: 简体中文 (zh)
#
# This file is read at startup, next to the program's lang/ directory. Edit it
# and restart the program - there is nothing to recompile.
#
#   * The keys under [strings] are stable ids used by the code. Never rename or
#     translate them; only change the text on the right of "=".
#   * A value may contain {0}, {1}, ... which the program fills in. Keep every
#     placeholder the original text had, and do not invent new ones.
#   * Adding a language: copy this file to lang/<code>.toml, change code / names
#     / tag below, translate the [strings] values, then put that code in
#     config.toml's "language" field. Untranslated ids fall back to the built-in
#     base language, so a half-done file is usable.
#   * Deleting this file is harmless: the built-in copy is used again.
#
# 本文件在启动时读取（位于程序旁的 lang/ 目录）。改完重启程序即可生效，无需编译。
#   * [strings] 下的 key 是代码使用的稳定 ID，不要改名或翻译，只改 "=" 右边的文案。
#   * 文案里的 {0} {1} 是程序填的占位符；原有占位符要保留，不要自己新增。
#   * 加一门语言：把本文件复制成 lang/<code>.toml，改下面的 code / names / tag，
#     翻译 [strings] 的值，再把该 code 填进 config.toml 的 language 字段。
#     没翻译的 ID 会回退到内置基础语言，所以翻一半也能用。
#   * 删掉本文件不影响启动：会自动回退到内置的同一份文案。

code  = "zh"
tag   = "zh-CN"
# config.toml 的 language 字段接受的写法（不区分大小写）
# "language" values accepted in config.toml (case-insensitive)
names = ["zh", "chinese", "中文"]

# 日志行里出现这些词会被标红 / 标黄。必须匹配本语言日志的真实措辞。
# Substrings that colour a log line red / yellow - must match what
# this language's log lines really say.
err_words  = [
    "失败", "错误", "异常", "无法", "出错", "failed", "error", "exception",
    "cannot", "unable",
]
warn_words = ["警告", "丢弃", "warning", "discard"]

# config.toml 的 timezone 字段额外接受的写法 -> 归一化结果
# Extra words accepted in config.toml's "timezone" -> canonical form
[tz_words]
"自动"     = "auto"
"本机"     = "auto"
"跟随本机" = "auto"
"系统"     = "auto"
"本地"     = "auto"
"北京时间" = "beijing"
"北京"     = "beijing"
"游戏时间" = "utc"
"ed时间"   = "utc"

